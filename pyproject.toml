[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "sigma-siphon"
version = "0.1.2"
description = "Acquire, reconcile, clip, and IO-tag Philippine POIs from OSM and Overture."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "James Matthew Miraflor"}]
dependencies = [
  "geopandas>=1.0,<2",
  "openai>=1.50,<4",
  "overturemaps>=1.0.2,<2",
  "pandas>=2.2,<4",
  "pyarrow>=16,<27",
  "PyYAML>=6,<7",
  "rapidfuzz>=3.9,<4",
  "requests>=2.32,<3",
  "rich>=13.7,<16",
  "shapely>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
sigma-siphon = "sigma_siphon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma_siphon"]

[tool.hatch.build.targets.wheel.force-include]
"config/areas.yml" = "sigma_siphon/data/areas.yml"
"data/boundaries/areas.gpkg" = "sigma_siphon/data/boundaries/areas.gpkg"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
